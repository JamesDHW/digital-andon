name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      # architecture-rules is a public GitHub dependency that the lockfile records as an SSH address;
      # runners have no SSH key, so fetch it over HTTPS instead.
      - run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
