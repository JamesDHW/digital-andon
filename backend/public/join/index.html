<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Digital Andon</title>
<style>
  :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --surface: #ffffff; --page: #f5f5f7; --accent: #0a84ff; --border: #d2d2d7; }
  @media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --muted: #a1a1a6; --surface: #1c1c1e; --page: #000000; --border: #38383a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 420px; margin: 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
  p { color: var(--muted); margin: 0 0 20px; }
  .lights { display: flex; gap: 8px; margin-bottom: 20px; }
  .lights span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid; }
  a.button { display: block; text-align: center; padding: 10px 16px; border-radius: 10px; text-decoration: none; margin-bottom: 10px; font-weight: 500; }
  a.primary { background: var(--accent); color: #fff; }
  a.secondary { border: 1px solid var(--border); color: var(--text); }
  ol { color: var(--muted); padding-left: 20px; margin: 16px 0 0; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="lights" aria-hidden="true">
    <span style="background:#b3f2be;border-color:#2ea043"></span>
    <span style="background:#ffe69c;border-color:#e8900c"></span>
    <span style="background:#ffc7c7;border-color:#e03131"></span>
  </div>
  <h1>Join your team's andon board</h1>
  <p id="status">Opening Digital Andon…</p>
  <a class="button primary" id="open" href="#">Open in Digital Andon</a>
  <a class="button secondary" href="/download">Download Digital Andon for Mac</a>
  <ol>
    <li>Download and open Digital Andon, then drag it to Applications.</li>
    <li>Come back to this page and choose <strong>Open in Digital Andon</strong>.</li>
  </ol>
</main>
<script>
  const code = new URLSearchParams(location.search).get("code");
  const status = document.getElementById("status");
  const openLink = document.getElementById("open");
  if (code === null || code.length === 0) {
    status.textContent = "This invite link is incomplete. Ask your team lead for a new one.";
    openLink.remove();
  } else {
    const appLink = "andon://join?server=" + encodeURIComponent(location.origin) + "&code=" + encodeURIComponent(code);
    openLink.href = appLink;
    status.textContent = "If Digital Andon didn't open, install it first, then choose Open in Digital Andon.";
    location.href = appLink;
  }
</script>
</body>
</html>
